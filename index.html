
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkomy VIP Debrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .movie-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
        .loader {
            border: 3px solid #1e293b;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-exit { transform: translateY(20px); opacity: 0; }
        
        /* تجميل سكرول المتصفح */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen relative">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-95">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-4 border-blue-500">
            <i class="fas fa-user-shield text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-3xl font-bold mb-6 text-white">تسجيل الدخول</h2>
            
            <div class="space-y-4 text-right">
                <div>
                    <label class="block text-gray-400 mb-1 text-sm">اسم المستخدم</label>
                    <input type="text" id="username" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="أدخل اسم المستخدم" dir="ltr">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 text-sm">كلمة المرور</label>
                    <input type="password" id="password" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••" dir="ltr">
                </div>
                <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 rounded-lg mt-4 shadow-lg transform transition active:scale-95">
                    دخول <i class="fas fa-sign-in-alt ml-2"></i>
                </button>
            </div>
            <p id="loginError" class="text-red-400 text-sm mt-4 hidden">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        
        <!-- Header -->
        <header class="glass-panel sticky top-0 z-30 shadow-lg px-4 py-3 border-b border-slate-700">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-film text-blue-500 text-3xl"></i>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                        Elkomy VIP
                    </h1>
                </div>
                
                <div class="flex-1 min-w-[250px] max-w-2xl relative">
                    <input type="text" id="searchInput" onkeypress="handleEnter(event)" class="w-full bg-slate-800 border border-slate-600 rounded-full pl-12 pr-6 py-2.5 text-white focus:outline-none focus:border-blue-500 transition shadow-inner" placeholder="ابحث عن فيلم، أو ضع رابط Magnet...">
                    <button onclick="executeAction()" class="absolute left-1 top-1 bottom-1 bg-blue-600 hover:bg-blue-500 text-white px-5 rounded-full transition flex items-center justify-center">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="toggleSettings()" class="bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-full transition" title="الإعدادات">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button onclick="logout()" class="bg-red-900/50 hover:bg-red-800 text-red-300 p-2.5 rounded-full transition" title="تسجيل خروج">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </header>

        <div id="settingsArea" class="hidden max-w-7xl mx-auto w-full p-4 mt-4">
            <div class="glass-panel p-4 rounded-xl border border-slate-600">
                <label class="block text-sm font-semibold mb-2">TorBox API Key (لتشغيل التحميل):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 text-left" dir="ltr">
                    <button onclick="saveApiKey()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-bold transition">حفظ</button>
                </div>
            </div>
        </div>

        <main class="flex-1 max-w-7xl mx-auto w-full p-4 mt-4">
            
            <!-- Loading Indicator -->
            <div id="globalLoader" class="hidden flex flex-col items-center justify-center py-20">
                <span class="loader w-12 h-12"></span>
                <p id="loaderText" class="text-blue-400 font-semibold mt-4 text-lg">جاري البحث في السيرفرات العالمية...</p>
            </div>

            <!-- Results Grid -->
            <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Movie cards will be injected here -->
            </div>
            
            <!-- Direct Download Status -->
            <div id="downloadStatus" class="hidden glass-panel rounded-xl p-6 text-center border border-blue-500/30 max-w-2xl mx-auto mt-10">
                <i class="fas fa-cloud-download-alt text-4xl text-blue-400 mb-3"></i>
                <h3 id="dlTitle" class="text-xl font-bold text-white mb-2" dir="ltr">جاري التجهيز...</h3>
                <p id="dlProgress" class="text-gray-400 mb-6">يرجى الانتظار...</p>
                
                <div id="dlButtons" class="hidden flex flex-wrap gap-3 justify-center">
                    <a id="btnDownload" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-lg font-bold transition flex items-center gap-2">
                        <i class="fas fa-download"></i> تحميل مباشر
                    </a>
                    <button id="btnWatch" onclick="startStreaming()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-bold transition flex items-center gap-2">
                        <i class="fas fa-play"></i> مشاهدة الآن
                    </button>
                </div>
            </div>

        </main>
    </div>

    <div id="videoModal" class="hidden fixed inset-0 bg-black z-[100] flex flex-col">
        <!-- شريط علوي للمشغل -->
        <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-10 flex justify-between items-center transition-opacity duration-300 hover:opacity-100 opacity-0" id="playerControls">
            <h2 id="videoTitle" class="text-white font-bold text-lg truncate px-4" dir="ltr">جاري التشغيل...</h2>
            <button onclick="closeVideoPlayer()" class="text-white hover:text-red-500 bg-black/50 rounded-full w-10 h-10 flex items-center justify-center transition">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <div class="flex-1 bg-black flex items-center justify-center relative">
            <!-- 
               خصائص الشاشات الذكية: 
               playsinline, x-webkit-airplay="allow" (للآيفون والآبل تي في)
               controlsList="nodownload" (اختياري)
            -->
            <video id="videoPlayer" class="w-full h-full max-h-screen" controls playsinline x-webkit-airplay="allow" crossorigin="anonymous">
                <source id="videoSource" src="" type="video/mp4">
                متصفحك لا يدعم مشغل الفيديو المتقدم.
            </video>
            
            <!-- إشعار استئناف المشاهدة -->
            <div id="resumeToast" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-blue-600/90 text-white px-4 py-2 rounded-full text-sm font-bold hidden shadow-lg">
                تم استئناف المشاهدة من حيث توقفت 🎬
            </div>
        </div>
    </div>

    <div id="toast" class="toast-exit fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg transition-all duration-300 z-[110] text-white pointer-events-none">
        رسالة
    </div>

    <script>
        // --- 1. State & Constants ---
        const DEFAULT_API_KEY = "610978e6-60be-4d90-97af-c77f0efd8caf";
        let checkingInterval;
        let currentStreamUrl = "";
        let currentMovieHash = ""; 
        let cachedMovies = {};

        // --- 2. Authentication Logic ---
        window.onload = function() {
            checkAuth();
            let savedKey = localStorage.getItem("torbox_key");
            if (!savedKey) {
                localStorage.setItem("torbox_key", DEFAULT_API_KEY);
                savedKey = DEFAULT_API_KEY;
            }
            document.getElementById("apiKeyInput").value = savedKey;
        };

        function checkAuth() {
            const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
            if (isLoggedIn) {
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
            } else {
                document.getElementById("loginScreen").classList.remove("hidden");
                document.getElementById("mainApp").classList.add("hidden");
            }
        }

        function handleLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const errorEl = document.getElementById("loginError");
            
            // بيانات الدخول (للتطوير، يمكن ربطها بقاعدة بيانات لاحقاً)
            if (user === "admin" && pass === "12345") {
                localStorage.setItem("isLoggedIn", "true");
                errorEl.classList.add("hidden");
                showToast("تم تسجيل الدخول بنجاح!", false);
                checkAuth();
            } else {
                errorEl.classList.remove("hidden");
            }
        }

        function logout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            checkAuth();
        }

        // --- 3. UI Helpers ---
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg transition-all duration-300 z-[110] text-white ${isError ? 'bg-red-600' : 'bg-emerald-600'} toast-enter`;
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
            }, 3000);
        }

        function toggleSettings() {
            document.getElementById("settingsArea").classList.toggle("hidden");
        }

        function saveApiKey() {
            const newKey = document.getElementById("apiKeyInput").value.trim();
            if (newKey) {
                localStorage.setItem("torbox_key", newKey);
                showToast("تم حفظ المفتاح بنجاح!");
                toggleSettings();
            }
        }

        function getApiKey() {
            return localStorage.getItem("torbox_key") || DEFAULT_API_KEY;
        }

        function formatBytes(bytes) {
            if (!+bytes) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') executeAction();
        }

        async function executeAction() {
            const input = document.getElementById("searchInput").value.trim();
            if (!input) return showToast("الرجاء إدخال بحث أو رابط!", true);

            document.getElementById("moviesGrid").innerHTML = "";
            document.getElementById("downloadStatus").classList.add("hidden");

            if (input.startsWith("magnet:") || input.startsWith("http")) {
                startDebridConversion(input);
            } else {
                searchMovies(input);
            }
        }

        async function searchMovies(query) {
            showLoader("جاري البحث في YIFY و قواعد البيانات...");
            
            let results = [];
            const encodedQuery = encodeURIComponent(query);

            try {
                // 1. المحرك الجديد: YIFY (YTS Clone) - https://en.yify.sc
                // نستخدم AllOrigins كبروكسي لتفادي مشكلة CORS
                const yifyUrl = `https://en.yify.sc/api/v2/list_movies.json?query_term=${encodedQuery}&limit=5`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yifyUrl)}`;
                
                const yifyRes = await fetch(proxyUrl);
                const yifyData = await yifyRes.json();

                if (yifyData && yifyData.data && yifyData.data.movies) {
                    yifyData.data.movies.forEach(m => {
                        let movie = {
                            id: m.id,
                            title: m.title,
                            year: m.year,
                            rating: m.rating,
                            cover: m.large_cover_image || m.medium_cover_image,
                            torrents: []
                        };
                        m.torrents.forEach(t => {
                            movie.torrents.push({
                                quality: `${t.quality} | ${t.size}`,
                                hash: t.hash
                            });
                        });
                        results.push(movie);
                    });
                }
            } catch (e) {
                console.log("YIFY search failed, trying fallback...", e);
            }

            // 2. البحث المساعد (Stremio/Cinemeta) لو YIFY مجابش نتايج كفاية
            if (results.length < 2) {
                try {
                    const cineUrl = `https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodedQuery}.json`;
                    const cineRes = await fetch(cineUrl);
                    const cineData = await cineRes.json();
                    
                    if (cineData.metas) {
                        for (let m of cineData.metas.slice(0, 3)) {
                            let movie = {
                                id: m.imdb_id,
                                title: m.name,
                                year: m.releaseInfo,
                                rating: m.imdbRating || "N/A",
                                cover: m.poster,
                                torrents: []
                            };
                            
                            // استخراج الجودات من Torrentio
                            try {
                                const torUrl = `https://torrentio.strem.fun/stream/movie/${m.imdb_id}.json`;
                                const torRes = await fetch(torUrl);
                                const torData = await torRes.json();
                                
                                let seen = new Set();
                                (torData.streams || []).forEach(s => {
                                    if(s.infoHash && !seen.has(s.infoHash)) {
                                        let qMatch = s.name.match(/(1080p|720p|4k|2160p)/i);
                                        let quality = qMatch ? qMatch[0].toUpperCase() : "HD";
                                        let sizeMatch = s.title.match(/💾\s*([^\n⚙️]+)/);
                                        let size = sizeMatch ? sizeMatch[1].trim() : "N/A";
                                        
                                        movie.torrents.push({ quality: `${quality} | ${size}`, hash: s.infoHash });
                                        seen.add(s.infoHash);
                                    }
                                });
                                // نأخذ أفضل 4 جودات
                                movie.torrents = movie.torrents.slice(0, 4);
                            } catch(e){}
                            
                            if (movie.torrents.length > 0) results.push(movie);
                        }
                    }
                } catch (e) {
                    console.log("Cinemeta fallback failed.", e);
                }
            }

            hideLoader();
            renderMovies(results);
        }

        function renderMovies(movies) {
            const grid = document.getElementById("moviesGrid");
            grid.innerHTML = "";
            
            if (movies.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">لم يتم العثور على نتائج. جرب اسماً بالإنجليزية.</div>`;
                return;
            }

            movies.forEach(m => {
                cachedMovies[m.id] = m;
                let buttonsHtml = m.torrents.map(t => 
                    `<button onclick="startDebridConversion('magnet:?xt=urn:btih:${t.hash}&dn=${encodeURIComponent(m.title)}', '${t.hash}')" 
                     class="w-full bg-slate-700 hover:bg-blue-600 text-white text-sm py-2 rounded transition border border-slate-600 hover:border-blue-500 mb-2">
                        🎬 ${t.quality}
                    </button>`
                ).join('');

                const card = `
                    <div class="movie-card glass-panel rounded-xl overflow-hidden flex flex-col">
                        <div class="relative pt-[150%]">
                            <img src="${m.cover}" onerror="this.src='https://placehold.co/400x600/1e293b/3b82f6?text=No+Poster'" class="absolute top-0 left-0 w-full h-full object-cover">
                            <div class="absolute top-2 right-2 bg-black/70 text-yellow-400 text-xs font-bold px-2 py-1 rounded border border-yellow-500/30">
                                <i class="fas fa-star"></i> ${m.rating}
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col">
                            <h3 class="font-bold text-lg mb-1 truncate" dir="ltr">${m.title}</h3>
                            <p class="text-gray-400 text-sm mb-4">${m.year}</p>
                            <div class="mt-auto space-y-1">
                                ${buttonsHtml}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function showLoader(text) {
            document.getElementById("globalLoader").classList.remove("hidden");
            document.getElementById("loaderText").innerText = text;
            document.getElementById("moviesGrid").innerHTML = "";
            document.getElementById("downloadStatus").classList.add("hidden");
        }

        function hideLoader() {
            document.getElementById("globalLoader").classList.add("hidden");
        }

        async function startDebridConversion(link, hash = "") {
            document.getElementById("moviesGrid").innerHTML = "";
            document.getElementById("downloadStatus").classList.remove("hidden");
            document.getElementById("dlButtons").classList.add("hidden");
            document.getElementById("dlTitle").innerText = "تهيئة السيرفر...";
            document.getElementById("dlProgress").innerText = "جاري إرسال الطلب لـ TorBox...";
            
            // حفظ الهاش عشان الاستئناف
            currentMovieHash = hash || btoa(link).substring(0, 10); 

            const apiKey = getApiKey();
            const headers = { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/x-www-form-urlencoded" };
            const isTorrent = link.startsWith("magnet:");
            const endpoint = isTorrent ? "torrents/createtorrent" : "webdl/createwebdownload";
            const payload = isTorrent ? `magnet=${encodeURIComponent(link)}` : `link=${encodeURIComponent(link)}`;

            try {
                const response = await fetch(`https://api.torbox.app/v1/api/${endpoint}`, {
                    method: "POST", headers: headers, body: payload
                });
                const data = await response.json();
                
                if (data.success) {
                    let itemId = data.data.torrent_id || data.data.web_id || data.data.id || data.data.uid;
                    if (!itemId) { // Fallback get latest
                         await new Promise(r => setTimeout(r, 2000));
                         const listRes = await fetch(`https://api.torbox.app/v1/api/${isTorrent ? 'torrents' : 'webdl'}/mylist`, {headers});
                         const listData = await listRes.json();
                         if(listData.success && listData.data.length > 0) itemId = listData.data[0].id;
                    }
                    if (itemId) {
                        monitorProgress(itemId, isTorrent, apiKey);
                    } else {
                        debridError("تم القبول ولكن فشل استخراج كود التتبع.");
                    }
                } else {
                    debridError(`الرفض من السيرفر: ${data.detail}`);
                }
            } catch (error) {
                debridError("خطأ في الاتصال بسيرفر التحميل.");
            }
        }

        async function monitorProgress(itemId, isTorrent, apiKey) {
            const apiPath = isTorrent ? "torrents" : "webdl";
            let attempts = 0;
            if(checkingInterval) clearTimeout(checkingInterval);

            const check = async () => {
                attempts++;
                if(attempts > 60) return debridError("انتهى وقت الانتظار. الملف ضخم ويحمل في الخلفية.");

                try {
                    const res = await fetch(`https://api.torbox.app/v1/api/${apiPath}/mylist`, { headers: { "Authorization": `Bearer ${apiKey}` } });
                    const data = await res.json();
                    
                    if(data.success) {
                        const target = data.data.find(i => String(i.id) === String(itemId) || String(i.uid) === String(itemId)) || data.data[0];
                        if(target) {
                            const state = target.download_state || target.status || "unknown";
                            if (["error", "failed"].includes(state)) return debridError(`فشل التحميل (الحالة: ${state})`);

                            if (["completed", "seeding", "cached", "finished"].includes(state)) {
                                document.getElementById("dlProgress").innerText = "اكتمل! جاري سحب الرابط המباشر...";
                                getDirectLink(target, apiPath, apiKey, isTorrent);
                                return;
                            } else {
                                document.getElementById("dlProgress").innerText = `جاري التحميل في السيرفر السحابي (محاولة ${attempts}/60)...`;
                            }
                        }
                    }
                } catch(e) {}
                checkingInterval = setTimeout(check, 5000);
            };
            check(); 
        }

        async function getDirectLink(targetItem, apiPath, apiKey, isTorrent) {
            const files = targetItem.files || [];
            let fileId = null;
            let fileName = targetItem.name || "Movie";

            // فلترة لأكبر ملف فيديو (نتجاهل الصور وملفات txt)
            if (files.length > 0) {
                const videoFiles = files.filter(f => f.name.match(/\.(mp4|mkv|avi|webm)$/i));
                const targetFiles = videoFiles.length > 0 ? videoFiles : files;
                const targetFile = targetFiles.reduce((max, f) => (f.size > max.size ? f : max), targetFiles[0]);
                fileId = targetFile.id;
                fileName = targetFile.name;
            }

            let dlUrl = `https://api.torbox.app/v1/api/${apiPath}/requestdl?token=${apiKey}&zip_link=false`;
            if (isTorrent) dlUrl += `&torrent_id=${targetItem.id}`;
            else dlUrl += `&web_id=${targetItem.id}`;
            if (fileId) dlUrl += `&file_id=${fileId}`;

            try {
                let res = await fetch(dlUrl, { headers: { "Authorization": `Bearer ${apiKey}` } });
                let data = await res.json();
                
                // المحاولة بدون File ID لو فشلت
                if (!data.success && fileId) {
                    let altUrl = dlUrl.replace(`&file_id=${fileId}`, '');
                    res = await fetch(altUrl, { headers: { "Authorization": `Bearer ${apiKey}` } });
                    data = await res.json();
                }

                if (data.success) {
                    currentStreamUrl = data.data;
                    document.getElementById("dlTitle").innerText = fileName;
                    document.getElementById("dlProgress").innerText = "تم التجهيز بنجاح! جاهز للعرض أو التحميل.";
                    document.getElementById("btnDownload").href = currentStreamUrl;
                    document.getElementById("dlButtons").classList.remove("hidden");
                    
                    // تحديث اسم الفيديو في المشغل
                    document.getElementById("videoTitle").innerText = fileName;
                    showToast("جاهز للمشاهدة!");
                } else {
                    debridError(`فشل سحب الرابط: ${data.detail}`);
                }
            } catch (e) {
                debridError("حدث خطأ أثناء جلب الرابط.");
            }
        }

        function debridError(msg) {
            document.getElementById("dlProgress").innerHTML = `<span class='text-red-400'><i class="fas fa-exclamation-triangle"></i> ${msg}</span>`;
            document.getElementById("dlButtons").classList.add("hidden");
        }

        // --- 4. Video Player & Resume Feature ---
        const videoPlayer = document.getElementById("videoPlayer");
        const videoSource = document.getElementById("videoSource");
        let resumeSaved = false;

        function startStreaming() {
            if (!currentStreamUrl) return;
            document.getElementById("videoModal").classList.remove("hidden");
            document.body.style.overflow = "hidden"; // منع السكرول للصفحة
            
            videoSource.src = currentStreamUrl;
            videoPlayer.load();
            resumeSaved = false;

            // استعادة وقت المشاهدة
            const savedTime = localStorage.getItem(`resume_${currentMovieHash}`);
            if (savedTime && parseFloat(savedTime) > 10) {
                videoPlayer.currentTime = parseFloat(savedTime);
                showResumeToast();
            }
            videoPlayer.play();
        }

        function closeVideoPlayer() {
            // حفظ الدقيقة الحالية قبل الإغلاق
            saveProgress();
            
            videoPlayer.pause();
            videoSource.src = "";
            document.getElementById("videoModal").classList.add("hidden");
            document.body.style.overflow = "auto";
        }

        // حفظ التقدم بشكل دوري كل 5 ثواني
        videoPlayer.addEventListener("timeupdate", () => {
            if (videoPlayer.currentTime > 5 && !videoPlayer.paused) {
                // حفظ فقط إذا لم ينتهي الفيلم (قبل النهاية بـ 3 دقائق مثلا)
                if(videoPlayer.duration - videoPlayer.currentTime > 180){
                    localStorage.setItem(`resume_${currentMovieHash}`, videoPlayer.currentTime);
                } else {
                    // مسح الحفظ إذا انتهى الفيلم
                    localStorage.removeItem(`resume_${currentMovieHash}`);
                }
            }
        });

        function saveProgress() {
            if (videoPlayer.currentTime > 5) {
                localStorage.setItem(`resume_${currentMovieHash}`, videoPlayer.currentTime);
            }
        }

        function showResumeToast() {
            const toast = document.getElementById("resumeToast");
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 4000);
        }

        // إخفاء/إظهار شريط التحكم العلوي مع حركة الماوس
        let controlsTimeout;
        document.getElementById("videoModal").addEventListener("mousemove", () => {
            const controls = document.getElementById("playerControls");
            controls.style.opacity = "1";
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if(!videoPlayer.paused) controls.style.opacity = "0";
            }, 3000);
        });

    </script>
</body>
</html>
