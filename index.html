
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkomy VIP Debrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .movie-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
        .loader {
            border: 3px solid #1e293b;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-exit { transform: translateY(20px); opacity: 0; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen relative">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-95">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-4 border-blue-500">
            <i class="fas fa-user-shield text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-3xl font-bold mb-6 text-white">تسجيل الدخول</h2>
            
            <div class="space-y-4 text-right">
                <div>
                    <label class="block text-gray-400 mb-1 text-sm">اسم المستخدم</label>
                    <input type="text" id="username" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="أدخل اسم المستخدم" dir="ltr">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 text-sm">كلمة المرور</label>
                    <input type="password" id="password" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••" dir="ltr">
                </div>
                <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 rounded-lg mt-4 shadow-lg transform transition active:scale-95">
                    دخول <i class="fas fa-sign-in-alt ml-2"></i>
                </button>
            </div>
            <p id="loginError" class="text-red-400 text-sm mt-4 hidden">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        
        <header class="glass-panel sticky top-0 z-30 shadow-lg px-4 py-3 border-b border-slate-700">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-film text-blue-500 text-3xl"></i>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                        Elkomy VIP
                    </h1>
                </div>
                
                <div class="flex-1 min-w-[250px] max-w-2xl relative">
                    <input type="text" id="searchInput" onkeypress="handleEnter(event)" class="w-full bg-slate-800 border border-slate-600 rounded-full pl-12 pr-6 py-2.5 text-white focus:outline-none focus:border-blue-500 transition shadow-inner" placeholder="ابحث عن فيلم/مسلسل، أو ضع رابط Magnet...">
                    <button onclick="executeAction()" class="absolute left-1 top-1 bottom-1 bg-blue-600 hover:bg-blue-500 text-white px-5 rounded-full transition flex items-center justify-center">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="toggleSettings()" class="bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-full transition" title="الإعدادات">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button onclick="logout()" class="bg-red-900/50 hover:bg-red-800 text-red-300 p-2.5 rounded-full transition" title="تسجيل خروج">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </header>

        <div id="settingsArea" class="hidden max-w-7xl mx-auto w-full p-4 mt-4">
            <div class="glass-panel p-4 rounded-xl border border-slate-600">
                <label class="block text-sm font-semibold mb-2">TorBox API Key (مفتاح التشغيل):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 text-left" dir="ltr">
                    <button onclick="saveApiKey()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-bold transition">حفظ</button>
                </div>
            </div>
        </div>

        <main class="flex-1 max-w-7xl mx-auto w-full p-4 mt-4">
            
            <div id="globalLoader" class="hidden flex flex-col items-center justify-center py-20">
                <span class="loader w-12 h-12"></span>
                <p id="loaderText" class="text-blue-400 font-semibold mt-4 text-lg">جاري البحث...</p>
            </div>

            <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- سيتم حقن الأفلام هنا -->
            </div>
            
            <div id="downloadStatus" class="hidden glass-panel rounded-xl p-6 text-center border border-blue-500/30 max-w-2xl mx-auto mt-10 shadow-2xl">
                <i class="fas fa-cloud-download-alt text-5xl text-blue-400 mb-4 animate-pulse"></i>
                <h3 id="dlTitle" class="text-xl font-bold text-white mb-2" dir="ltr">جاري التجهيز...</h3>
                <p id="dlProgress" class="text-gray-300 mb-6 text-lg">يرجى الانتظار...</p>
                
                <div id="dlButtons" class="hidden flex flex-wrap gap-4 justify-center">
                    <a id="btnDownload" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-bold transition flex items-center gap-2 shadow-lg hover:shadow-blue-500/50">
                        <i class="fas fa-download"></i> تحميل مباشر
                    </a>
                    <button id="btnWatch" onclick="startStreaming()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-lg font-bold transition flex items-center gap-2 shadow-lg hover:shadow-emerald-500/50">
                        <i class="fas fa-play"></i> مشاهدة الآن
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- مشغل الفيديو السينمائي -->
    <div id="videoModal" class="hidden fixed inset-0 bg-black z-[100] flex flex-col">
        <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/90 to-transparent z-10 flex justify-between items-center transition-opacity duration-300 hover:opacity-100 opacity-0" id="playerControls">
            <h2 id="videoTitle" class="text-white font-bold text-lg truncate px-4 drop-shadow-md" dir="ltr">جاري التشغيل...</h2>
            <button onclick="closeVideoPlayer()" class="text-white hover:text-red-500 bg-black/60 rounded-full w-12 h-12 flex items-center justify-center transition shadow-lg">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
        
        <div class="flex-1 bg-black flex items-center justify-center relative w-full h-full">
            <video id="videoPlayer" class="w-full h-full max-h-screen object-contain" controls playsinline x-webkit-airplay="allow" crossorigin="anonymous">
                <source id="videoSource" src="" type="video/mp4">
                متصفحك لا يدعم مشغل الفيديو.
            </video>
            
            <div id="resumeToast" class="absolute bottom-24 left-1/2 transform -translate-x-1/2 bg-blue-600/95 text-white px-6 py-3 rounded-full text-sm font-bold hidden shadow-2xl border border-blue-400">
                <i class="fas fa-history mr-2"></i> تم استئناف المشاهدة 🎬
            </div>
        </div>
    </div>

    <div id="toast" class="toast-exit fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg transition-all duration-300 z-[110] text-white pointer-events-none">
        رسالة
    </div>

    <script>
        const DEFAULT_API_KEY = "610978e6-60be-4d90-97af-c77f0efd8caf";
        let checkingInterval;
        let currentStreamUrl = "";
        let currentMovieHash = ""; 
        let cachedMovies = {};

        window.onload = function() {
            checkAuth();
            let savedKey = localStorage.getItem("torbox_key");
            if (!savedKey) {
                localStorage.setItem("torbox_key", DEFAULT_API_KEY);
                savedKey = DEFAULT_API_KEY;
            }
            document.getElementById("apiKeyInput").value = savedKey;
        };

        function checkAuth() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
            } else {
                document.getElementById("loginScreen").classList.remove("hidden");
                document.getElementById("mainApp").classList.add("hidden");
            }
        }

        function handleLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            if (user === "admin" && pass === "12345") {
                localStorage.setItem("isLoggedIn", "true");
                document.getElementById("loginError").classList.add("hidden");
                showToast("تم تسجيل الدخول بنجاح!");
                checkAuth();
            } else {
                document.getElementById("loginError").classList.remove("hidden");
            }
        }

        function logout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            checkAuth();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-xl transition-all duration-300 z-[110] text-white font-bold ${isError ? 'bg-red-600' : 'bg-emerald-600'} toast-enter`;
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
            }, 3000);
        }

        function toggleSettings() {
            document.getElementById("settingsArea").classList.toggle("hidden");
        }

        function saveApiKey() {
            const newKey = document.getElementById("apiKeyInput").value.trim();
            if (newKey) {
                localStorage.setItem("torbox_key", newKey);
                showToast("تم حفظ المفتاح بنجاح!");
                toggleSettings();
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') executeAction();
        }

        // =========================================================================
        // نظام الدبابة (Triple-Layer Proxy) لتخطي حظر الشركات المصرية (CORS Bypass)
        // =========================================================================
        async function fetchTorboxAPI(endpoint, paramsObj = {}, method = "GET") {
            const apiKey = localStorage.getItem("torbox_key") || DEFAULT_API_KEY;
            let targetUrl = `https://api.torbox.app/v1/api/${endpoint}`;
            
            // تهيئة الطلب بصيغة x-www-form-urlencoded (عشان المتصفح والبروكسي ميشكوش فيه)
            let options = {
                method: method,
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Accept": "application/json"
                }
            };

            if (method === "POST") {
                options.headers["Content-Type"] = "application/x-www-form-urlencoded";
                options.body = new URLSearchParams(paramsObj).toString();
            } else if (method === "GET" && Object.keys(paramsObj).length > 0) {
                targetUrl += `?${new URLSearchParams(paramsObj).toString()}`;
            }

            // قائمة البروكسيات القوية والمجانية
            const proxies = [
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://thingproxy.freeboard.io/fetch/${targetUrl}`,
                targetUrl // محاولة الاتصال المباشر كحل أخير
            ];

            let lastError = "";
            for (const proxyUrl of proxies) {
                try {
                    const res = await fetch(proxyUrl, options);
                    const data = await res.json();
                    if (data) return data; 
                } catch (error) {
                    lastError = error.message;
                    console.log(`فشل الاتصال عبر ${proxyUrl}، جاري تجربة التالي...`);
                }
            }

            return { success: false, detail: `فشل الاتصال بجميع السيرفرات بسبب الحماية: ${lastError}` };
        }

        // دالة مخصصة للبحث عشان Stremio/Yify
        async function fetchSearchAPI(url) {
            const proxies = [
                url, // المباشر الأول عشان أسرع
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
            ];
            
            for (const pUrl of proxies) {
                try {
                    const res = await fetch(pUrl);
                    if (res.ok) return await res.json();
                } catch(e) { /* التجربة في اللي بعده */ }
            }
            return null;
        }
        // =========================================================================

        async function executeAction() {
            const input = document.getElementById("searchInput").value.trim();
            if (!input) return showToast("الرجاء إدخال بحث أو رابط!", true);

            document.getElementById("moviesGrid").innerHTML = "";
            document.getElementById("downloadStatus").classList.add("hidden");

            if (input.startsWith("magnet:") || input.startsWith("http")) {
                startDebridConversion(input);
            } else {
                searchHybrid(input);
            }
        }

        async function searchHybrid(query) {
            showLoader("جاري البحث في قاعدة البيانات...");
            let results = [];
            const encodedQuery = encodeURIComponent(query);
            const isSeries = query.includes("مسلسل") || query.toLowerCase().includes("series");

            try {
                const type = isSeries ? 'series' : 'movie';
                const cUrl = `https://v3-cinemeta.strem.io/catalog/${type}/top/search=${encodedQuery}.json`;
                const cData = await fetchSearchAPI(cUrl);
                
                if (cData && cData.metas) {
                    for (let m of cData.metas.slice(0, 4)) {
                        let item = {
                            id: m.imdb_id || m.id, title: m.name, year: m.releaseInfo,
                            rating: m.imdbRating || "N/A", cover: m.poster,
                            type: m.type === 'series' ? "مسلسل" : "فيلم", torrents: []
                        };
                        
                        const torUrl = `https://torrentio.strem.fun/stream/${m.type}/${item.id}.json`;
                        const torData = await fetchSearchAPI(torUrl);
                        
                        let seen = new Set();
                        if(torData && torData.streams) {
                            torData.streams.forEach(s => {
                                if(s.infoHash && !seen.has(s.infoHash)) {
                                    let qMatch = s.name.match(/(1080p|720p|4k|2160p)/i);
                                    let quality = qMatch ? qMatch[0].toUpperCase() : "HD";
                                    let sizeMatch = s.title.match(/💾\s*([^\n⚙️]+)/);
                                    let size = sizeMatch ? sizeMatch[1].trim() : "N/A";
                                    
                                    let label = item.type === "مسلسل" ? `📺 ${quality}` : `🎬 ${quality}`;
                                    let seasonMatch = s.title.match(/S\d+E\d+/i) || s.title.match(/Season \d+/i);
                                    if(seasonMatch) label = `📺 ${seasonMatch[0]} | ${quality}`;

                                    item.torrents.push({ quality: `${label} | ${size}`, hash: s.infoHash });
                                    seen.add(s.infoHash);
                                }
                            });
                        }
                        item.torrents = item.torrents.slice(0, 4);
                        if (item.torrents.length > 0) results.push(item);
                    }
                }
            } catch (e) { console.log("Search failed:", e); }

            hideLoader();
            renderMovies(results);
        }

        function renderMovies(movies) {
            const grid = document.getElementById("moviesGrid");
            grid.innerHTML = "";
            
            if (movies.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-400 py-10 font-bold text-xl"><i class="fas fa-exclamation-circle mb-2 text-3xl"></i><br>لم يتم العثور على نتائج. جرب اسماً بالإنجليزية.</div>`;
                return;
            }

            movies.forEach(m => {
                cachedMovies[m.id] = m;
                let buttonsHtml = m.torrents.map(t => 
                    `<button onclick="startDebridConversion('magnet:?xt=urn:btih:${t.hash}&dn=${encodeURIComponent(m.title)}', '${t.hash}')" 
                     class="w-full bg-slate-700 hover:bg-blue-600 text-white text-sm py-2.5 rounded-lg transition border border-slate-600 hover:border-blue-400 mb-2 font-semibold shadow-sm">
                        ${t.quality}
                    </button>`
                ).join('');

                const typeBadge = m.type === "مسلسل" ? 'bg-purple-600' : 'bg-blue-600';

                const card = `
                    <div class="movie-card glass-panel rounded-xl overflow-hidden flex flex-col relative border border-slate-700">
                        <div class="absolute top-2 left-2 ${typeBadge} text-white text-xs font-bold px-2.5 py-1 rounded-md z-10 shadow-lg">
                            ${m.type}
                        </div>
                        <div class="relative pt-[140%]">
                            <img src="${m.cover}" onerror="this.src='https://placehold.co/400x600/1e293b/3b82f6?text=No+Poster'" class="absolute top-0 left-0 w-full h-full object-cover">
                            <div class="absolute top-2 right-2 bg-black/80 text-yellow-400 text-xs font-bold px-2 py-1 rounded border border-yellow-500/30 backdrop-blur-sm">
                                <i class="fas fa-star"></i> ${m.rating}
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col bg-slate-800/50">
                            <h3 class="font-bold text-lg mb-1 truncate text-white" dir="ltr" title="${m.title}">${m.title}</h3>
                            <p class="text-blue-300 text-sm mb-4 font-semibold">${m.year}</p>
                            <div class="mt-auto">
                                ${buttonsHtml}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function showLoader(text) {
            document.getElementById("globalLoader").classList.remove("hidden");
            document.getElementById("loaderText").innerText = text;
            document.getElementById("moviesGrid").innerHTML = "";
            document.getElementById("downloadStatus").classList.add("hidden");
        }

        function hideLoader() {
            document.getElementById("globalLoader").classList.add("hidden");
        }

        async function startDebridConversion(link, hash = "") {
            document.getElementById("moviesGrid").innerHTML = "";
            document.getElementById("downloadStatus").classList.remove("hidden");
            document.getElementById("dlButtons").classList.add("hidden");
            
            const dlProgress = document.getElementById("dlProgress");
            document.getElementById("dlTitle").innerText = "تهيئة السيرفر...";
            dlProgress.innerHTML = `<span class="text-blue-400"><i class="fas fa-spinner fa-spin"></i> جاري إرسال الطلب للسيرفر المضيف...</span>`;
            
            currentMovieHash = hash || btoa(link).substring(0, 10); 

            const isTorrent = link.startsWith("magnet:");
            const endpoint = isTorrent ? "torrents/createtorrent" : "webdl/createwebdownload";
            
            const payload = {};
            if (isTorrent) payload.magnet = link;
            else payload.link = link;

            try {
                // الاتصال بنظام الدبابة الجديد
                const data = await fetchTorboxAPI(endpoint, payload, "POST");
                
                if (data && data.success) {
                    let itemId = data.data.torrent_id || data.data.web_id || data.data.id || data.data.uid;
                    
                    if (!itemId) { 
                         dlProgress.innerHTML = `<span class="text-yellow-400"><i class="fas fa-search"></i> جاري استخراج كود الملف...</span>`;
                         await new Promise(r => setTimeout(r, 2000));
                         const listData = await fetchTorboxAPI(isTorrent ? 'torrents/mylist' : 'webdl/mylist', {}, "GET");
                         if(listData && listData.success && listData.data.length > 0) itemId = listData.data[0].id;
                    }

                    if (itemId) {
                        monitorProgress(itemId, isTorrent);
                    } else {
                        debridError("تم القبول ولكن فشل استخراج كود التتبع من السيرفر.");
                    }
                } else {
                    debridError(`الرفض من السيرفر: ${data ? data.detail || JSON.stringify(data) : 'بدون رد'}`);
                }
            } catch (error) {
                debridError(`مشكلة في الاتصال المباشر. تفاصيل: ${error.message}`);
            }
        }

        async function monitorProgress(itemId, isTorrent) {
            const apiPath = isTorrent ? "torrents" : "webdl";
            let attempts = 0;
            if(checkingInterval) clearTimeout(checkingInterval);

            const check = async () => {
                attempts++;
                if(attempts > 60) return debridError("انتهى وقت الانتظار. الملف ضخم ويتم تحميله في الخلفية.");

                try {
                    const data = await fetchTorboxAPI(`${apiPath}/mylist`, {}, "GET");
                    
                    if(data && data.success) {
                        const target = data.data.find(i => String(i.id) === String(itemId) || String(i.uid) === String(itemId)) || data.data[0];
                        if(target) {
                            const state = target.download_state || target.status || "unknown";
                            if (["error", "failed"].includes(state)) return debridError(`فشل التحميل من المصدر (الحالة: ${state})`);

                            if (["completed", "seeding", "cached", "finished", "downloaded"].includes(state)) {
                                document.getElementById("dlProgress").innerHTML = `<span class="text-emerald-400"><i class="fas fa-check-circle"></i> اكتمل! جاري سحب الرابط المباشر...</span>`;
                                getDirectLink(target, apiPath, isTorrent);
                                return;
                            } else {
                                const progressTxt = target.progress ? `(${Math.round(target.progress * 100)}%)` : '';
                                document.getElementById("dlProgress").innerText = `جاري التحميل في السيرفر السحابي ${progressTxt} (محاولة ${attempts}/60)...`;
                            }
                        }
                    }
                } catch(e) {
                    console.log("Monitor Error:", e);
                }
                checkingInterval = setTimeout(check, 5000); 
            };
            check(); 
        }

        async function getDirectLink(targetItem, apiPath, isTorrent) {
            const files = targetItem.files || [];
            let fileId = null;
            let fileName = targetItem.name || "الملف جاهز";

            if (files.length > 0) {
                const videoFiles = files.filter(f => f.name.match(/\.(mp4|mkv|avi|webm)$/i));
                const targetFiles = videoFiles.length > 0 ? videoFiles : files;
                const targetFile = targetFiles.reduce((max, f) => (f.size > max.size ? f : max), targetFiles[0]);
                fileId = targetFile.id;
                fileName = targetFile.name;
            }

            const params = { zip_link: "false" };
            if (isTorrent) params.torrent_id = targetItem.id;
            else params.web_id = targetItem.id;
            if (fileId) params.file_id = fileId;

            try {
                let data = await fetchTorboxAPI(`${apiPath}/requestdl`, params, "GET");
                
                if (data && !data.success && fileId) {
                    delete params.file_id; 
                    data = await fetchTorboxAPI(`${apiPath}/requestdl`, params, "GET");
                }

                if (data && data.success) {
                    currentStreamUrl = data.data;
                    document.getElementById("dlTitle").innerText = fileName;
                    document.getElementById("dlProgress").innerHTML = `<span class="text-emerald-400 font-bold"><i class="fas fa-check"></i> تم التجهيز بنجاح! جاهز للعرض أو التحميل.</span>`;
                    document.getElementById("btnDownload").href = currentStreamUrl;
                    document.getElementById("dlButtons").classList.remove("hidden");
                    
                    document.getElementById("videoTitle").innerText = fileName;
                    showToast("الملف جاهز للمشاهدة!");
                } else {
                    debridError(`فشل سحب الرابط المباشر: ${data ? data.detail : 'خطأ غير معروف'}`);
                }
            } catch (e) {
                debridError(`حدث خطأ أثناء جلب الرابط المباشر.`);
            }
        }

        function debridError(msg) {
            document.getElementById("dlProgress").innerHTML = `<span class='text-red-400 font-bold bg-red-900/30 px-4 py-2 rounded-lg inline-block'><i class="fas fa-exclamation-triangle mr-2"></i> ${msg}</span>`;
            document.getElementById("dlButtons").classList.add("hidden");
        }

        // --- مشغل الفيديو واستكمال المشاهدة ---
        const videoPlayer = document.getElementById("videoPlayer");
        const videoSource = document.getElementById("videoSource");

        function startStreaming() {
            if (!currentStreamUrl) return;
            document.getElementById("videoModal").classList.remove("hidden");
            document.body.style.overflow = "hidden"; 
            
            videoSource.src = currentStreamUrl;
            videoPlayer.load();

            const savedTime = localStorage.getItem(`resume_${currentMovieHash}`);
            if (savedTime && parseFloat(savedTime) > 15) {
                videoPlayer.currentTime = parseFloat(savedTime);
                showResumeToast();
            }
            videoPlayer.play();
        }

        function closeVideoPlayer() {
            saveProgress(); 
            videoPlayer.pause();
            videoSource.src = "";
            document.getElementById("videoModal").classList.add("hidden");
            document.body.style.overflow = "auto";
        }

        videoPlayer.addEventListener("timeupdate", () => {
            if (videoPlayer.currentTime > 15 && !videoPlayer.paused) {
                if(videoPlayer.duration && (videoPlayer.duration - videoPlayer.currentTime > 180)){
                    localStorage.setItem(`resume_${currentMovieHash}`, videoPlayer.currentTime);
                } else if (videoPlayer.duration && (videoPlayer.duration - videoPlayer.currentTime <= 180)) {
                    localStorage.removeItem(`resume_${currentMovieHash}`); 
                }
            }
        });

        function saveProgress() {
            if (videoPlayer.currentTime > 15) {
                localStorage.setItem(`resume_${currentMovieHash}`, videoPlayer.currentTime);
            }
        }

        function showResumeToast() {
            const toast = document.getElementById("resumeToast");
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 5000);
        }

        let controlsTimeout;
        document.getElementById("videoModal").addEventListener("mousemove", () => {
            const controls = document.getElementById("playerControls");
            controls.style.opacity = "1";
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if(!videoPlayer.paused) controls.style.opacity = "0";
            }, 3000);
        });

    </script>
</body>
</html>
