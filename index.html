<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkomy Debrid - VIP Access</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-main); }
        
        /* شاشة تسجيل الدخول */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: var(--panel-bg); padding: 2rem; border-radius: 12px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box h2 { color: var(--primary); margin-top: 0; }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #334155; background: var(--bg-color); color: white; text-align: center;
        }
        .login-btn {
            width: 100%; padding: 12px; background: var(--primary); color: #000;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;
        }
        .error-msg { color: var(--danger); margin-top: 10px; display: none; }

        /* المحتوى الأساسي */
        #main-content { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); }
        .user-badge { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 14px; display: inline-block; }
        
        /* شريط البحث */
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: var(--panel-bg); color: white;
        }
        .search-btn {
            padding: 12px 25px; background: var(--primary); color: #000;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
        }

        /* كروت النتائج */
        .movie-card {
            background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px;
            display: flex; gap: 15px; align-items: flex-start;
        }
        .movie-poster { width: 100px; border-radius: 8px; }
        .quality-btn {
            background: #6366f1; color: white; padding: 5px 10px; border: none; border-radius: 5px; 
            cursor: pointer; margin-left: 5px; margin-bottom: 5px; font-weight: bold;
        }
        
        .result-card {
            background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-top: 15px;
            border-left: 4px solid #22c55e;
        }
        .btn-download { background: #22c55e; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .btn-vlc { background: #f97316; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; display: inline-block; margin-top: 10px; margin-right: 5px; }
        
        /* رسالة الخطأ زي الصورة */
        .no-results { text-align: center; color: var(--danger); font-size: 20px; font-weight: bold; display: none; margin-top: 40px; }
        .no-results span { display: block; font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Elkomy VIP 🎬</h2>
            <input type="text" id="username" class="login-input" placeholder="اسم المستخدم">
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور">
            <button class="login-btn" onclick="checkLogin()">دخول</button>
            <p id="login-error" class="error-msg">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <div id="main-content">
        <div class="header">
            <h1>Elkomy VIP 🚀</h1>
            <div id="user-welcome" class="user-badge"></div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم (إنجليزي)، أو الصق رابط مباشر/تورنت...">
            <button class="search-btn" onclick="processInput()">بحث</button>
        </div>

        <div id="loading" style="display: none; text-align: center; color: var(--primary);">جاري المعالجة... ⏳</div>
        <div id="results"></div>
        
        <div id="no-results-msg" class="no-results">
            <span>!</span>
            لم يتم العثور على نتائج.
        </div>
    </div>

    <script>
        const users = {
            "admin": { password: "elkomy2026", role: "الإدارة 👑" },
            "user": { password: "12345", role: "ضيف 👤" }
        };

        const SERVER_URL = "https://elkomy-server-production.up.railway.app/generate"; 

        function checkLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            if (users[userIn] && users[userIn].password === passIn) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('user-welcome').innerHTML = `أهلاً بك: <b>${userIn}</b> (${users[userIn].role})`;
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function processInput() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('results').innerHTML = '';
            document.getElementById('no-results-msg').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // لو المدخل عبارة عن رابط (مباشر أو ماجنيت) نبعته للسيرفر فوراً
            if (query.startsWith('http') || query.startsWith('magnet:')) {
                generateDebridLink(query);
                return;
            }

            // لو المدخل نص (اسم فيلم)، نبحث عنه في قاعدة الأفلام YTS
            try {
                const response = await fetch(`https://yts.mx/api/v2/list_movies.json?query_term=${encodeURIComponent(query)}`);
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (data.data && data.data.movie_count > 0) {
                    displayMovies(data.data.movies);
                } else {
                    document.getElementById('no-results-msg').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('no-results-msg').style.display = 'block';
            }
        }

        function displayMovies(movies) {
            let html = '';
            movies.forEach(movie => {
                html += `
                <div class="movie-card">
                    <img src="${movie.medium_cover_image}" class="movie-poster" alt="poster">
                    <div>
                        <h3 style="margin:0 0 5px 0; color:var(--primary);">${movie.title} (${movie.year})</h3>
                        <p style="margin:0 0 10px 0; font-size:13px; color:var(--text-muted);">تقييم: ⭐ ${movie.rating}/10</p>
                        <div>
                `;
                // عرض الجودات المتاحة
                movie.torrents.forEach(t => {
                    const trackers = "&tr=udp://open.demonii.com:1337/announce&tr=udp://tracker.openbittorrent.com:80";
                    const magnet = `magnet:?xt=urn:btih:${t.hash}&dn=${encodeURIComponent(movie.title)}${trackers}`;
                    html += `<button class="quality-btn" onclick="generateDebridLink('${magnet}')">${t.quality} ${t.type}</button>`;
                });
                
                html += `</div></div></div>`;
            });
            document.getElementById('results').innerHTML = html;
        }

        async function generateDebridLink(linkOrMagnet) {
            const resultsDiv = document.getElementById('results');
            // نحتفظ بكروت الأفلام ونضيف رسالة التحميل تحتها
            const currentHTML = resultsDiv.innerHTML;
            resultsDiv.innerHTML = currentHTML + `<div id="debrid-status" style="text-align:center; color:var(--primary); margin-top:20px;">جاري إرسال الطلب لسيرفر Elkomy وفك التشفير... ⏳</div>`;
            
            // عمل سكرول لتحت عشان تشوف النتيجة
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: linkOrMagnet }) 
                });

                const data = await response.json();
                document.getElementById('debrid-status').remove();

                if (data.direct_link) {
                    resultsDiv.innerHTML += `
                        <div class="result-card">
                            <h3 style="margin:0 0 10px 0; color:#22c55e;">✅ تم فك الرابط بنجاح!</h3>
                            <a href="${data.direct_link}" target="_blank" class="btn-download">تحميل مباشر ⬇️</a>
                            <button class="btn-vlc" onclick="navigator.clipboard.writeText('${data.direct_link}').then(()=>alert('تم النسخ لـ VLC!'))">نسخ الرابط 📋</button>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML += `<p style="color:var(--danger); text-align:center; margin-top:20px;">خطأ: ${data.error || 'غير معروف'}</p>`;
                }
            } catch (error) {
                document.getElementById('debrid-status').remove();
                resultsDiv.innerHTML += `<p style="color:var(--danger); text-align:center; margin-top:20px;">خطأ في الاتصال بسيرفر Railway.</p>`;
            }
        }
    </script>
</body>
</html>
