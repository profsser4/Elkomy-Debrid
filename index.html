<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elkomy Debrid VIP</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--primary:#38bdf8;--text:#f8fafc;--danger:#ef4444;--success:#22c55e}
*{box-sizing:border-box;font-family:Tahoma}body{margin:0;background:var(--bg);color:var(--text)}
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--panel);padding:2rem;border-radius:12px;width:90%;max-width:400px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.5)}
.login-input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #334155;background:var(--bg);color:#fff;text-align:center}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;font-size:16px}
#main-content{display:none;padding:20px;max-width:800px;margin:0 auto}
.action-box{background:var(--panel);padding:30px 20px;border-radius:10px;margin-bottom:20px;border:1px solid #334155;text-align:center}
.search-container{display:flex;flex-direction:column;gap:15px;margin-top:20px}
.search-input{width:100%;padding:15px;border-radius:8px;border:1px solid #334155;background:var(--bg);color:#fff;text-align:left;direction:ltr;font-size:14px}
.search-btn{width:100%;padding:15px;background:var(--success);color:#fff;font-weight:bold;border:none;border-radius:8px;cursor:pointer;font-size:16px}
.result-card{background:var(--panel);padding:20px;border-radius:8px;margin-top:20px;border:1px solid var(--success);text-align:center}
.btn-download{background:var(--success);color:#fff;padding:12px 20px;border-radius:5px;text-decoration:none;display:inline-block;margin-top:15px;font-weight:bold;width:100%}
.btn-vlc{background:#f97316;color:#fff;padding:12px 20px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin-top:10px;width:100%}
.pending{text-align:center;color:#38bdf8;padding:20px;font-weight:bold;background:var(--panel);border-radius:8px;border:1px dashed #38bdf8}
.warn{text-align:center;color:#f59e0b;padding:15px;background:var(--panel);border-radius:8px;border:1px dashed #f59e0b}
video{width:100%;border-radius:8px;background:#000}
</style>
</head>
<body>

<div id="login-screen">
<div class="login-box">
<h2 style="color:var(--primary)">Elkomy VIP 🚀</h2>
<input id="username" class="login-input" placeholder="اسم المستخدم" autocapitalize="off" autocorrect="off" autocomplete="username">
<input id="password" type="password" class="login-input" placeholder="كلمة المرور" autocomplete="current-password">
<button class="login-btn" onclick="checkLogin()">دخول</button>
<p id="login-error" style="color:var(--danger);display:none;margin-top:10px">بيانات الدخول غير صحيحة!</p>
</div>
</div>

<div id="main-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
    <h1 style="color:var(--primary);margin:0">Elkomy VIP 🚀</h1>
    <button onclick="sessionStorage.clear();location.reload()" style="background:var(--danger);color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer">خروج</button>
</div>

<div class="action-box">
<h2 style="margin-top:0;color:white">🔗 فك الروابط المباشرة والتورنت</h2>
<p style="color:#94a3b8;font-size:14px;margin-bottom:15px">ضع رابط Magnet أو رابط تحميل مباشر هنا للحصول على المشاهدة المباشرة</p>
<div class="search-container">
<input id="linkInput" class="search-input" placeholder="magnet:?xt=... أو https://...">
<button class="search-btn" onclick="processDirectLink()">سحب الرابط الآن 🚀</button>
</div>
</div>

<div id="results"></div>
</div>

<script>
const USER="admin";
const PASS="admin";
const SERVER_URL="https://elkomy-server-production.up.railway.app/generate";
const MAX_TRIES=90; // × 5 ثواني = 7.5 دقيقة

window.onload=()=>{ if(sessionStorage.isLoggedIn==="true") showMainContent(); };

document.addEventListener('keydown',e=>{
 if(e.key==='Enter' && document.getElementById('login-screen').style.display!=='none') checkLogin();
});

function checkLogin(){
 const u=document.getElementById('username').value.trim().toLowerCase();
 const p=document.getElementById('password').value.trim();
 if(u===USER && p===PASS){
  sessionStorage.setItem("isLoggedIn","true");
  showMainContent();
 }else{
  document.getElementById('login-error').style.display='block';
 }
}

function showMainContent(){
 document.getElementById('login-screen').style.display='none';
 document.getElementById('main-content').style.display='block';
}

function processDirectLink(){
 let link=document.getElementById('linkInput').value.trim();
 if(!link) return alert("الرجاء لصق الرابط أولاً");
 if(!link.startsWith('http') && !link.startsWith('magnet:')) link='https://'+link;
 sendToRailway(link);
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function sendToRailway(link, torrentId=null, tries=0){
 const box=document.getElementById('results');
 if(tries===0) box.innerHTML=`<div class="pending">⏳ جاري سحب الرابط...</div>`;

 try{
  const res=await fetch(SERVER_URL,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({query:link, torrent_id:torrentId})
  });
  const data=await res.json();

  // لسه بيجهز: اسأل تاني تلقائياً
  if(res.status===202 && tries<MAX_TRIES){
   const pct=data.progress?` – ${(data.progress*100).toFixed(0)}%`:'';
   box.innerHTML=`<div class="pending">⏳ ${esc(data.status||'جاري التجهيز')}${pct}<br><span style="font-size:12px;color:#94a3b8">متقفلش الصفحة</span></div>`;
   return setTimeout(()=>sendToRailway(link, data.torrent_id||torrentId, tries+1),5000);
  }

  if(data.direct_link){
   const url=data.direct_link;
   box.innerHTML=`
   <div class="result-card">
    <h3 style="margin:0 0 15px 0;color:var(--success)">✅ الملف جاهز!</h3>
    ${data.name?`<p style="direction:ltr;font-size:13px;color:#94a3b8;word-break:break-all">${esc(data.name)}</p>`:''}
    <video controls src="${esc(url)}"></video>
    <a href="${esc(url)}" target="_blank" class="btn-download">⬇️ فتح / تحميل مباشر</a>
    <button class="btn-vlc" id="copyBtn">📋 نسخ الرابط (للصقه في VLC)</button>
   </div>`;
   document.getElementById('copyBtn').onclick=()=>{ navigator.clipboard.writeText(url); alert('تم نسخ الرابط!'); };
  }else{
   box.innerHTML=`<div class="warn">${esc(data.error||'حصل خطأ')}</div>`;
  }
 }catch(e){
  box.innerHTML=`<div class="warn" style="color:#ef4444">❌ مش قادر أوصل للسيرفر.</div>`;
 }
}
</script>
</body>
</html>
