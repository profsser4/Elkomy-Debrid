
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkomy Debrid - VIP v2 Fixed</title>
    <style>
        :root { --bg-color: #0f172a; --panel-bg: #1e293b; --primary: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-main); }
        #login-screen { position: fixed; inset: 0; background: var(--bg-color); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: var(--panel-bg); padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: var(--bg-color); color: white; text-align: center; }
        .login-btn { width: 100%; padding: 12px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .error-msg { color: var(--danger); margin-top: 10px; display: none; }
        #main-content { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .action-box { background: var(--panel-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        .search-container { display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--bg-color); color: white; }
        .search-btn { padding: 12px 25px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        .movie-card { background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 15px; border: 1px solid #334155; }
        .movie-poster { width: 100px; border-radius: 8px; background: #334155; }
        .quality-btn { background: #6366f1; color: white; padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; font-size: 13px; }
        .result-card { background: var(--panel-bg); padding: 20px; border-radius: 8px; margin-top: 15px; border-left: 4px solid var(--success); }
        .btn-download { background: var(--success); color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 10px; border: none; cursor: pointer; }
        .btn-vlc { background: #f97316; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; display: inline-block; margin-top: 10px; margin-right: 5px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin-bottom: 10px; }
        .user-badge { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 14px; display: inline-block; margin-bottom: 10px; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Elkomy VIP 🚀</h2>
            <input type="text" id="username" class="login-input" placeholder="اسم المستخدم" onkeypress="if(event.key==='Enter') checkLogin()">
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter') checkLogin()">
            <button type="button" class="login-btn" onclick="checkLogin()">تسجيل الدخول</button>
            <p id="login-error" class="error-msg">بيانات غير صحيحة!</p>
        </div>
    </div>

    <!-- محتوى الموقع -->
    <div id="main-content">
        <div class="header">
            <h1>Elkomy VIP 🚀</h1>
            <div id="user-welcome" class="user-badge"></div>
            <button type="button" class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </div>

        <!-- مربع البحث عن الأفلام -->
        <div class="action-box">
            <h3 style="margin-top:0;">🔍 البحث عن فيلم (أجنبي)</h3>
            <div class="search-container">
                <input type="text" id="movieSearchInput" class="search-input" placeholder="اكتب اسم الفيلم بالإنجليزي (مثال: Batman)" onkeypress="if(event.key==='Enter') processMovieSearch()">
                <button type="button" class="search-btn" onclick="processMovieSearch()">بحث</button>
            </div>
        </div>

        <!-- مربع سحب الروابط -->
        <div class="action-box">
            <h3 style="margin-top:0;">🔗 فك رابط أو تورنت</h3>
            <div class="search-container">
                <input type="text" id="linkInput" class="search-input" placeholder="الصق رابط (1fichier, magnet) هنا..." onkeypress="if(event.key==='Enter') processDirectLink()">
                <button type="button" class="search-btn" style="background: var(--success); color: white;" onclick="processDirectLink()">سحب الرابط</button>
            </div>
        </div>

        <div id="loading" style="display: none; text-align: center; color: var(--primary); font-weight: bold; padding: 20px;">جاري المعالجة... ⏳</div>
        <div id="results"></div>
    </div>

    <script>
        // 1. نظام الحسابات
        const users = {
            "admin": { password: "elkomy2026", role: "الإدارة 👑" },
            "user": { password: "12345", role: "ضيف 👤" }
        };

        const SERVER_URL = "https://elkomy-server-production.up.railway.app/generate"; 

        // التحقق من الجلسة عند فتح الموقع
        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showMainContent(sessionStorage.getItem("savedUsername"), sessionStorage.getItem("savedRole"));
            }
        };

        function checkLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            
            if (users[userIn] && users[userIn].password === passIn) {
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("savedUsername", userIn);
                sessionStorage.setItem("savedRole", users[userIn].role);
                showMainContent(userIn, users[userIn].role);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function showMainContent(username, role) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('user-welcome').innerHTML = `أهلاً بك: <b>${username}</b> (${role})`;
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }

        // 2. البحث عن فيلم (YTS API)
        async function processMovieSearch() {
            const query = document.getElementById('movieSearchInput').value.trim();
            if (!query) return alert("اكتب اسم الفيلم أولاً.");

            document.getElementById('results').innerHTML = '';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`https://yts.mx/api/v2/list_movies.json?query_term=${encodeURIComponent(query)}`);
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (data.data && data.data.movie_count > 0) {
                    displayMovies(data.data.movies);
                } else {
                    document.getElementById('results').innerHTML = `<p style="text-align:center; color:var(--danger); font-weight:bold;">❌ لم يتم العثور على أفلام.</p>`;
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').innerHTML = `<p style="text-align:center; color:var(--danger); font-weight:bold;">❌ خطأ في محرك البحث.</p>`;
            }
        }

        function displayMovies(movies) {
            let html = '<h3 style="color: var(--primary);">نتائج البحث:</h3>';
            movies.forEach(movie => {
                html += `
                <div class="movie-card">
                    <img src="${movie.medium_cover_image}" class="movie-poster" alt="poster" onerror="this.src=''">
                    <div>
                        <h3 style="margin:0 0 5px 0; color:var(--primary);">${movie.title} (${movie.year})</h3>
                        <p style="margin:0 0 10px 0; font-size:13px; color:var(--text-muted);">تقييم: ⭐ ${movie.rating}/10</p>
                        <div>
                `;
                movie.torrents.forEach(t => {
                    const magnet = `magnet:?xt=urn:btih:${t.hash}&dn=${encodeURIComponent(movie.title)}`;
                    html += `<button type="button" class="quality-btn" onclick="sendToRailway('${magnet}')">${t.quality} ${t.type}</button>`;
                });
                html += `</div></div></div>`;
            });
            document.getElementById('results').innerHTML = html;
        }

        // 3. سحب الرابط المباشر
        function processDirectLink() {
            let link = document.getElementById('linkInput').value.trim();
            if (!link) return alert("الصق الرابط أولاً.");
            
            if (!link.startsWith('http') && !link.startsWith('magnet:')) {
                link = 'https://' + link; // تصليح الرابط لو المستخدم نسي https
            }
            sendToRailway(link);
        }

        // 4. الاتصال بسيرفر Railway
        async function sendToRailway(linkOrMagnet) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div style="text-align:center; color:var(--success); margin-top:20px; font-weight:bold;">جاري إرسال الطلب لسيرفر Railway وفك التشفير... ⏳</div>`;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: linkOrMagnet }) 
                });

                const data = await response.json();
                
                if (data.direct_link) {
                    resultsDiv.innerHTML = `
                        <div class="result-card">
                            <h3 style="margin:0 0 10px 0; color:var(--success);">✅ تم فك الرابط بنجاح!</h3>
                            <a href="${data.direct_link}" target="_blank" class="btn-download">تحميل مباشر ⬇️</a>
                            <button type="button" class="btn-vlc" onclick="navigator.clipboard.writeText('${data.direct_link}').then(()=>alert('تم النسخ بنجاح! 📋'))">نسخ الرابط 📋</button>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `<p style="color:var(--danger); text-align:center; margin-top:20px; font-weight:bold;">❌ رسالة من السيرفر: ${data.error || 'عذراً، حدث خطأ'}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color:var(--danger); text-align:center; margin-top:20px; font-weight:bold;">❌ خطأ في الاتصال بسيرفر Railway. تأكد أن السيرفر يعمل.</p>`;
            }
        }
    </script>
</body>
</html>
