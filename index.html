<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elkomy Debrid VIP</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--primary:#38bdf8;--text:#f8fafc;--danger:#ef4444;--success:#22c55e}
*{box-sizing:border-box;font-family:Tahoma}body{margin:0;background:var(--bg);color:var(--text)}
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--panel);padding:2rem;border-radius:12px;width:90%;max-width:400px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.5)}
.login-input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #334155;background:var(--bg);color:#fff;text-align:center}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;font-size:16px}
#main-content{display:none;padding:20px;max-width:800px;margin:0 auto}
.action-box{background:var(--panel);padding:30px 20px;border-radius:10px;margin-bottom:20px;border:1px solid #334155;text-align:center}
.search-container{display:flex;flex-direction:column;gap:15px;margin-top:20px}
.search-input{width:100%;padding:15px;border-radius:8px;border:1px solid #334155;background:var(--bg);color:#fff;text-align:left;direction:ltr;font-size:14px}
.search-btn{width:100%;padding:15px;background:var(--success);color:#fff;font-weight:bold;border:none;border-radius:8px;cursor:pointer;font-size:16px}
.result-card{background:var(--panel);padding:20px;border-radius:8px;margin-top:20px;border:1px solid var(--success);text-align:center}
.btn-download{background:var(--success);color:#fff;padding:12px 20px;border-radius:5px;text-decoration:none;display:inline-block;margin-top:15px;font-weight:bold;width:100%}
.btn-vlc{background:#f97316;color:#fff;padding:12px 20px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin-top:10px;width:100%}
.pending{text-align:center;color:#38bdf8;padding:20px;font-weight:bold;background:var(--panel);border-radius:8px;border:1px dashed #38bdf8}
.warn{text-align:center;color:#f59e0b;padding:15px;background:var(--panel);border-radius:8px;border:1px dashed #f59e0b}
video{width:100%;border-radius:8px;background:#000}
</style>
</head>
<body>

<div id="login-screen">
<div class="login-box">
<h2 style="color:var(--primary)">Elkomy VIP 🚀</h2>
<input id="username" class="login-input"
