<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkomy Debrid - VIP Access</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-main); }
        
        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: var(--panel-bg); padding: 2rem; border-radius: 12px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box h2 { color: var(--primary); margin-top: 0; }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #334155; background: var(--bg-color); color: white; text-align: center;
        }
        .login-btn {
            width: 100%; padding: 12px; background: var(--primary); color: #000;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;
        }
        .error-msg { color: var(--danger); margin-top: 10px; display: none; }

        /* Main Content */
        #main-content { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin-bottom: 10px; }
        .user-badge { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 14px; display: inline-block; }
        
        .logout-btn {
            background: var(--danger); color: white; border: none; padding: 5px 15px;
            border-radius: 5px; cursor: pointer; margin-right: 10px; font-size: 12px;
        }

        /* Action Boxes (The New Split Layout) */
        .action-box {
            background: var(--panel-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .action-box h3 { margin-top: 0; color: var(--text-main); font-size: 18px; margin-bottom: 15px; }
        
        .search-container { display: flex; gap: 10px; }
        .search-input {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: var(--bg-color); color: white;
        }
        .search-btn {
            padding: 12px 25px; background: var(--primary); color: #000;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap;
        }

        /* Results */
        .movie-card {
            background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px;
            display: flex; gap: 15px; align-items: flex-start; border: 1px solid #334155;
        }
        .movie-poster { width: 100px; border-radius: 8px; }
        .quality-btn {
            background: #6366f1; color: white; padding: 6px 12px; border: none; border-radius: 5px; 
            cursor: pointer; margin-left: 5px; margin-bottom: 5px; font-weight: bold; font-size: 13px;
        }
        
        .result-card {
            background: var(--panel-bg); padding: 20px; border-radius: 8px; margin-top: 15px;
            border-left: 4px solid var(--success); border-right: 1px solid #334155; border-top: 1px solid #334155; border-bottom: 1px solid #334155;
        }
        .btn-download { background: var(--success); color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .btn-vlc { background: #f97316; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; display: inline-block; margin-top: 10px; margin-right: 5px; }
        
        .no-results { text-align: center; color: var(--danger); font-size: 18px; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Elkomy VIP 🚀</h2>
            <input type="text" id="username" class="login-input" placeholder="اسم المستخدم" onkeypress="handleLoginEnter(event)">
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور" onkeypress="handleLoginEnter(event)">
            <button type="button" class="login-btn" onclick="checkLogin()">تسجيل الدخول</button>
            <p id="login-error" class="error-msg">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <div id="main-content">
        <div class="header">
            <h1>Elkomy VIP 🚀</h1>
            <div id="user-welcome" class="user-badge"></div>
            <button type="button" class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </div>

        <!-- المربع الأول: البحث عن الأفلام -->
        <div class="action-box">
            <h3>🔍 البحث عن فيلم (أجنبي)</h3>
            <div class="search-container">
                <input type="text" id="movieSearchInput" class="search-input" placeholder="اكتب اسم الفيلم بالإنجليزية (مثال: Batman)" onkeypress="handleMovieSearchEnter(event)">
                <button type="button" class="search-btn" onclick="processMovieSearch()">بحث</button>
            </div>
        </div>

        <!-- المربع الثاني: سحب الروابط المباشرة -->
        <div class="action-box">
            <h3>🔗 فك رابط أو تورنت مباشر</h3>
            <div class="search-container">
                <input type="text" id="linkInput" class="search-input" placeholder="الصق رابط كامل هنا (https://1fichier.com/... أو magnet:?xt=...)" onkeypress="handleLinkEnter(event)">
                <button type="button" class="search-btn" style="background: var(--success); color: white;" onclick="processDirectLink()">سحب الرابط</button>
            </div>
        </div>

        <div id="loading" style="display: none; text-align: center; color: var(--primary); padding: 20px; font-weight: bold;">جاري المعالجة... ⏳</div>
        <div id="results"></div>
    </div>

    <script>
        // الحسابات
        const users = {
            "admin": { password: "01111824400", role: "الإدارة 👑" },
            "user": { password: "12340855885**5", role: "ضيف 👤" }
        };

        const SERVER_URL = "https://elkomy-server-production.up.railway.app/generate"; 

        // حفظ تسجيل الدخول
        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showMainContent(sessionStorage.getItem("savedUsername"), sessionStorage.getItem("savedRole"));
            }
        };

        function handleLoginEnter(e) { if (e.key === 'Enter') { e.preventDefault(); checkLogin(); } }
        function handleMovieSearchEnter(e) { if (e.key === 'Enter') { e.preventDefault(); processMovieSearch(); } }
        function handleLinkEnter(e) { if (e.key === 'Enter') { e.preventDefault(); processDirectLink(); } }

        function checkLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            
            if (users[userIn] && users[userIn].password === passIn) {
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("savedUsername", userIn);
                sessionStorage.setItem("savedRole", users[userIn].role);
                showMainContent(userIn, users[userIn].role);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function showMainContent(username, role) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('user-welcome').innerHTML = `أهلاً بك: <b>${username}</b> (${role})`;
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }

        // دالة المربع الأول (البحث)
        async function processMovieSearch() {
            const query = document.getElementById('movieSearchInput').value.trim();
            if (!query) return alert("الرجاء كتابة اسم الفيلم أولاً.");

            document.getElementById('results').innerHTML = '';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`https://yts.mx/api/v2/list_movies.json?query_term=${encodeURIComponent(query)}`);
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (data.data && data.data.movie_count > 0) {
                    displayMovies(data.data.movies);
                } else {
                    document.getElementById('results').innerHTML = `<div class="no-results">❌ لم يتم العثور على أفلام بهذا الاسم.</div>`;
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').innerHTML = `<div class="no-results">❌ حدث خطأ أثناء البحث في قاعدة البيانات.</div>`;
            }
        }

        // عرض كروت الأفلام
        function displayMovies(movies) {
            let html = '<h3 style="color: var(--primary);">نتائج البحث:</h3>';
            movies.forEach(movie => {
                html += `
                <div class="movie-card">
                    <img src="${movie.medium_cover_image}" class="movie-poster" alt="poster">
                    <div>
                        <h3 style="margin:0 0 5px 0; color:var(--primary);">${movie.title} (${movie.year})</h3>
                        <p style="margin:0 0 10px 0; font-size:13px; color:var(--text-muted);">تقييم: ⭐ ${movie.rating}/10</p>
                        <div>
                `;
                movie.torrents.forEach(t => {
                    const trackers = "&tr=udp://open.demonii.com:1337/announce&tr=udp://tracker.openbittorrent.com:80";
                    const magnet = `magnet:?xt=urn:btih:${t.hash}&dn=${encodeURIComponent(movie.title)}${trackers}`;
                    html += `<button type="button" class="quality-btn" onclick="sendToRailway('${magnet}')">${t.quality} ${t.type}</button>`;
                });
                html += `</div></div></div>`;
            });
            document.getElementById('results').innerHTML = html;
        }

        // دالة المربع الثاني (الروابط المباشرة)
        function processDirectLink() {
            let link = document.getElementById('linkInput').value.trim();
            if (!link) return alert("الرجاء لصق الرابط أولاً.");
            
            // تصحيح الرابط لو المستخدم نسي يكتب https://
            if (!link.startsWith('http') && !link.startsWith('magnet:')) {
                link = 'https://' + link;
            }
            
            sendToRailway(link);
        }

        // الدالة المشتركة لإرسال الطلب لسيرفرك
        async function sendToRailway(linkOrMagnet) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div id="debrid-status" style="text-align:center; color:var(--success); margin-top:20px; font-weight:bold; font-size:18px;">جاري إرسال الطلب لسيرفر Railway وفك التشفير... ⏳</div>`;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: linkOrMagnet }) 
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.direct_link) {
                    resultsDiv.innerHTML = `
                        <div class="result-card">
                            <h3 style="margin:0 0 10px 0; color:var(--success);">✅ تم فك الرابط بنجاح!</h3>
                            <a href="${data.direct_link}" target="_blank" class="btn-download">تحميل مباشر ⬇️</a>
                            <button type="button" class="btn-vlc" onclick="navigator.clipboard.writeText('${data.direct_link}').then(()=>alert('تم النسخ بنجاح! 📋'))">نسخ الرابط 📋</button>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `<p style="color:var(--danger); text-align:center; margin-top:20px; font-weight:bold;">❌ خطأ من السيرفر: ${data.error || 'صيغة الرابط غير مدعومة أو الملف محذوف'}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color:var(--danger); text-align:center; margin-top:20px; font-weight:bold;">❌ خطأ في الاتصال بسيرفر Railway.<br><span style="font-size:14px; color:var(--text-muted);">السبب المحتمل: السيرفر نائم، أو الرابط خطأ، أو مشكلة اتصال.</span><br><span style="font-size:12px; color:#ef4444;">${error.message}</span></p>`;
            }
        }
    </script>
</body>
</html>
