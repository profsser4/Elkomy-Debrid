<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elkomy Debrid - VIP Access</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background: var(--bg-color); color: var(--text-main); }
        
        /* شاشة تسجيل الدخول */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: var(--panel-bg); padding: 2rem; border-radius: 12px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box h2 { color: var(--primary); margin-top: 0; }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #334155; background: var(--bg-color); color: white; text-align: center;
        }
        .login-btn {
            width: 100%; padding: 12px; background: var(--primary); color: #000;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;
        }
        .error-msg { color: var(--danger); margin-top: 10px; display: none; }

        /* محتوى الموقع الأساسي */
        #main-content { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); }
        .user-badge {
            background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 14px; display: inline-block;
        }
        
        /* شريط البحث */
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: var(--panel-bg); color: white;
        }
        .search-btn {
            padding: 12px 25px; background: var(--primary); color: #000;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
        }

        /* النتائج */
        .result-card {
            background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px;
            border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-download {
            background: #22c55e; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; font-size: 14px;
        }
        .btn-vlc {
            background: #f97316; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; font-size: 14px;
        }
        .btn-copy {
            background: #6366f1; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Elkomy Debrid 🎬</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">الرجاء تسجيل الدخول للمتابعة</p>
            
            <input type="text" id="username" class="login-input" placeholder="اسم المستخدم">
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور">
            
            <button class="login-btn" onclick="checkLogin()">دخول</button>
            <p id="login-error" class="error-msg">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <!-- المحتوى الأساسي (يظهر بعد تسجيل الدخول) -->
    <div id="main-content">
        <div class="header">
            <h1>Elkomy Debrid 🚀</h1>
            <div id="user-welcome" class="user-badge"></div>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 10px;">
                * لدعم الأفلام العربية: الصق رابط 1fichier أو Mega مباشرة في شريط البحث.
            </p>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم، أنمي، مسلسل، أو الصق رابط مباشر...">
            <button class="search-btn" onclick="performSearch()">بحث سريع</button>
        </div>

        <div id="loading" style="display: none; text-align: center; color: var(--primary);">جاري البحث وسحب الروابط... ⏳</div>
        <div id="results"></div>
    </div>

    <script>
        // ---------------------------------------------
        // 1. إعدادات الحسابات
        // ---------------------------------------------
        const users = {
            "admin": { password: "elkomy2026", role: "الإدارة 👑" },
            "user": { password: "12345", role: "ضيف 👤" }
        };

        const SERVER_URL = "https://elkomy-server-production.up.railway.app/generate"; 

        // ---------------------------------------------
        // 2. نظام تسجيل الدخول
        // ---------------------------------------------
        function checkLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (users[userIn] && users[userIn].password === passIn) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('user-welcome').innerHTML = `أهلاً بك: <b>${userIn}</b> (${users[userIn].role})`;
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // ---------------------------------------------
        // 3. نظام البحث وسحب الروابط
        // ---------------------------------------------
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return alert("اكتب اسم الفيلم أو الصق الرابط الأول!");

            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            
            resultsDiv.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query }) 
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.direct_link) {
                    resultsDiv.innerHTML = `
                        <div class="result-card">
                            <div style="flex-grow: 1;">
                                <h3 style="margin:0 0 10px 0;">تم سحب الرابط بنجاح! ✅</h3>
                                <p style="margin:0; font-size:12px; color:var(--text-muted);">جاهز للتحميل أو المشاهدة</p>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-copy" onclick="copyDirectLink('${data.direct_link}')">نسخ الرابط 📋</button>
                                <button class="btn-vlc" onclick="copyVlcLink('${data.direct_link}')">مشاهدة في VLC 📺</button>
                                <a href="${data.direct_link}" target="_blank" class="btn-download">تحميل مباشر ⬇️</a>
                            </div>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `<p style="color:var(--danger); text-align:center;">لم يتم العثور على روابط أو حدث خطأ: ${data.error || 'غير معروف'}</p>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultsDiv.innerHTML = `<p style="color:var(--danger); text-align:center;">خطأ في الاتصال بالسيرفر! تأكد أن سيرفر Railway يعمل.</p>`;
            }
        }

        // دوال النسخ
        function copyDirectLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                alert("تم نسخ الرابط بنجاح! 📋");
            });
        }

        function copyVlcLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                alert("تم نسخ الرابط! افتح تطبيق VLC واضغط على 'Network Stream' أو 'بث شبكة' والزق الرابط واستمتع بالمشاهدة.");
            });
        }
    </script>
</body>
</html>
